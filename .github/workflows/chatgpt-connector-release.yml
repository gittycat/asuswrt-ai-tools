# Build provenance attestation is deliberately absent here, along with
# notarization and a signed installer. The reasoning is in
# docs/chatgpt-connector.md, under "Deliberately not done".
name: Build ChatGPT connector release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos27-arm64:
    runs-on: ubuntu-latest
    env:
      TUNNEL_CLIENT_VERSION: "0.0.14"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"

      - name: Download the official OpenAI tunnel client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/upstream
          gh release download "v${TUNNEL_CLIENT_VERSION}" \
            --repo openai/tunnel-client \
            --pattern "tunnel-client-v${TUNNEL_CLIENT_VERSION}-darwin-arm64.zip" \
            --pattern "SHA256SUMS.txt" \
            --dir build/upstream

      - name: Build and verify the release archive
        run: |
          python3 packaging/chatgpt_connector/build_release.py \
            --tunnel-version "${TUNNEL_CLIENT_VERSION}" \
            --tunnel-archive "build/upstream/tunnel-client-v${TUNNEL_CLIENT_VERSION}-darwin-arm64.zip" \
            --tunnel-checksums build/upstream/SHA256SUMS.txt \
            --output-dir dist/release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asuswrt-chatgpt-connector-macos27-arm64
          path: dist/release/*

      - name: Add artifacts to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/release/* --clobber
