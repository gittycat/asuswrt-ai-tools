[project]
name = "asuswrt"
version = "0.8.0"
description = "CLI and MCP server to query and modify an ASUS (AsusWRT) router over its HTTP API"
readme = "README.md"
authors = [
    { name = "Main Admin", email = "accounts@kiluna.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asusrouter>=1.21.3",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
asuswrt = "asuswrt.cli.main:main"
asuswrt-probe = "asuswrt.probe:main"
asuswrt-mcp = "asuswrt.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=2,<3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# helpers.py is imported by name from the test modules.
pythonpath = ["tests"]
addopts = "-q --strict-markers"
